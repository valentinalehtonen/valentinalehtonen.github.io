<!DOCTYPE html>
<html lang="fi">

<head>
    <title>SpaceX Launch Data</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: black;
            color: white;
        }

        .carousel-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div class="p-5 bg-black text-white text-center">
        <a href="spacex.html" style="text-decoration: none; color: white;">
            <h1>SpaceX Rocket Launches</h1>
        </a>
        <p>Upcoming launch data and past launch archive</p>
    </div>

    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" href="spacex.html">Front page</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="upcoming.html">Upcoming launches</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="archive.html">Past launch archive</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container d-flex flex-column justify-content-center align-items-center text-center mt-4">
        <div id="vastaus"></div>
        <h2>Next Launch Countdown</h2>
        <h5 id="launch-name">Loading...</h5>
        <p>Time remaining:</p>
        <div id="countdown" class="fs-3 fw-bold text-danger">Loading...</div>
        <a id="more-info" href="#" class="btn btn-primary mt-3" target="_blank">More Info</a>
    </div>

    <div class="container mt-5">
        <h2 class="text-center text-white">Past Launches</h2>
        <div id="launchCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner" id="carousel-content">
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#launchCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#launchCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>

    <div class="container-fluid p-4 bg-dark text-white text-center mt-4">
        <ul class="nav justify-content-center">
            <li class="nav-item">
                <a class="nav-link text-white" href="spacex.html">Front page</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="upcoming.html">Upcoming launches</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="archive.html">Past launch archive</a>
            </li>
        </ul>
    </div>

    <script>

        function fetchLaunch() {

            fetch('https://lldev.thespacedevs.com/2.2.0/launch/upcoming/?limit=1')
                .then(function (response) {
                    return response.json();
                })

                .then(function (data) {
                    if (data.results.length > 0) {
                        var launch = data.results[0];
                        var launchTime = new Date(launch.window_start).getTime();
                        document.getElementById("launch-name").innerText = launch.name;

                        updateCountdown(launchTime);
                        setInterval(function () {
                            updateCountdown(launchTime);
                        }, 1000);
                    } else {
                        document.getElementById("countdown").innerText = "No upcoming launches found.";
                    }
                })
                .catch(function (error) {
                    document.getElementById("vastaus").innerHTML =
                        "<p class='text-danger'>No launch data found.</p>";
                });
        }

        function updateCountdown(launchTime) {
            var now = new Date().getTime();
            var timeDiff = launchTime - now;

            if (timeDiff <= 0) {
                document.getElementById("countdown").innerText = "Launch has occurred!";
                return;
            }

            var days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            var hours = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((timeDiff % (1000 * 60)) / 1000);

            document.getElementById("countdown").innerText = days + "d " + hours + "h " + minutes + "m " + seconds + "s";
        }

        function fetchPastLaunches() {
            fetch('https://lldev.thespacedevs.com/2.2.0/launch/previous/?limit=3')
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    var carouselContent = document.getElementById('carousel-content');
                    carouselContent.innerHTML = '';

                    if (data.results.length > 0) {
                        data.results.forEach(function (launch, index) {
                            var imageUrl = launch.image ? launch.image : "https://via.placeholder.com/500";
                            var activeClass = index === 0 ? 'active' : '';

                            var carouselItem =
                                '<div class="carousel-item ' + activeClass + '">' +
                                '<img src="' + imageUrl + '" class="d-block w-100" alt="Launch Image">' +
                                '<div class="carousel-caption d-none d-md-block">' +
                                '<h5>' + launch.name + '</h5>' +
                                '<p>' + new Date(launch.window_start).toLocaleString('fi-FI') + '</p>' +
                                '</div>' +
                                '</div>';
                            carouselContent.innerHTML += carouselItem;
                        });
                    } else {
                        carouselContent.innerHTML = '<p>No past launches found.</p>';
                    }
                })
                .catch(function (error) {
                    console.error('Error fetching past launches:', error);
                    document.getElementById('carousel-content').innerHTML = '<p class="text-danger">Failed to load past launches.</p>';
                });
        }

        fetchLaunch();
        fetchPastLaunches();

    </script>


</body>

</html>
