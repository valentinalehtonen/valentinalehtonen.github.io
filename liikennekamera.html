<body>

    <nav class="navbar navbar-dark navbar-expand-lg fixed-top" style="background-color: #4E342E;">
        <div class="container-fluid">
            <a class="navbar-brand text-bg-light p-2 rounded" href="#">JSON testailua</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="navbar-collapse collapse" id="navbar">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="kurssi.html">Kurssi</a></li>

                </ul>
    </nav>

    <div id="vastaus">

    </div>

    <script>
        function kerro(responseJson) {
            document.getElementById("vastaus").innerHTML = "<h1>Autolla Tampereelle</h1><br>Minkälainen keli siellä on?<br>";

            for (var i = 0; i < responseJson.presets.length; i++) {
                fetch(`https://tie.digitraffic.fi/api/weathercam/v1/stations/${responseJson.presets[i].id}/history`)
                    .then(function (response) {
                        return response.json();
                    })
                    .then(function (kuva) {
                        document.getElementById("vastaus").innerHTML +=
                            "<b>" + (kuva.history[0]?.dataUpdatedTime || "Ei saatavilla") + "</b><br>" +
                            `<img src="${kuva.history[0]?.imageUrl || ""}" alt="Liikennekameran kuva"/><br>`;
                    })
                    .catch(function () {
                        document.getElementById("vastaus").innerHTML += "<p>Kuvaa ei pystytä hakemaan</p>";
                    });
            }
        }

        fetch('https://tie.digitraffic.fi/api/weathercam/v1/stations/C04507/data')
            .then(function (response) {
                return response.json();
            })
            .then(function (responseJson) {
                console.log(responseJson);
                kerro(responseJson);
            })
            .catch(function () {
                document.getElementById("vastaus").innerHTML = "<p>Tietoa ei pystytä hakemaan</p>";
            });
    </script>

</body>
