    <script>
        function kerro(responseJson) {
            document.getElementById("vastaus").innerHTML = "<h1>Matka Tampereelle junalla</h1><br>";

            for (var i = 0; i < responseJson.length; i++) {
                if (responseJson[i].trainCategory == "Long-distance") {
                    for (var j = 0; responseJson[i].timeTableRows.length; j++) {
                        if (data[i].timeTableRows[j].stationShortCode == "TPE" && data[i].timeTableRows[j].type == "DEPARTURE") {
                            document.getElementById("vastaus").innerHTML += "<b>Juna" + responseJson[i].trainNumber + "</b><br>";
                            break;

                        }
                    }
                }
            }
        }

        fetch('https://rata.digitraffic.fi/api/v1/live-trains/station/HKI?departing_trains=10&include_nonstopping=false')
            .then(function (response) {
                return response.json();
            })
            .then(function (responseJson) {
                console.log(responseJson);
                kerro(responseJson);
            })
            .catch(function () {
                document.getElementById("vastaus").innerHTML = "<p>Tietoa ei pystytä hakemaan</p>";
