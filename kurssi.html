<!DOCTYPE html>

<html lang="fi">

<head>

    <title>JSON Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    body {
        font-family: Calibri, sans-serif;
        background-color: #ebdfdb;
        color: #4E342E;
    }

    img {
        max-width: 50%;
    }
</style>
</head>

<body>
    <div id="vastaus">

    </div>

    <script>

        function kerro(responseJson) {
            var teksti = "";
            teksti += "<h1>" + responseJson.otsikko + "</h1>";
            teksti += "<p>" + "<b>" + responseJson.kuvaus + "</b>" + "<br>";
            teksti += "<p>" + "<img src='" + responseJson.kuva + "' alt='Kuva huoneesta' />";
            teksti += "<p><b>" + "Opintojakso" + "</b></p>"
                + "Nimi: " + responseJson.opintojakso.nimi + "<br>"
                + "Tunnus: " + responseJson.opintojakso.tunnus + "<br>"
                + "Opintopisteet: " + responseJson.opintojakso.opintopisteet + "<br>";
            teksti += "<p><b>" + "Sisältö:" + "</b></p><br>"
            for (var i = 0; i < responseJson.sisalto.length; i++) {
                teksti += responseJson.sisalto[i] + "<br>";
            }
            teksti += "</p>";
            teksti += "<p><b>" + "Tekniikat:" + "</b></p><br>"
            for (var i = 0; i < responseJson.tekniikat.length; i++) {
                teksti += responseJson.tekniikat[i].aihe + " (linkki: " + responseJson.tekniikat[i].linkki + ")" + "<br>";
            }

            document.getElementById("vastaus").innerHTML = teksti;
        }
        fetch('https://valentinalehtonen.github.io/oma.JSON')
            .then(function (response) {
                return response.json();
            })

            .then(function (responseJson) {
                kerro(responseJson);
            })

            .catch(function (error) {
                document.getElementById("vastaus").innerHTML = "<p>Tietoa ei pystytä hakemaan</p>";
            })
    </script>

</body>
