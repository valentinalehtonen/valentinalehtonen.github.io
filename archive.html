<!DOCTYPE html>
<html lang="fi">

<head>
    <title>Past Launch Archive</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: black;
            color: white;
        }

        .card {
            background-color: #222;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="p-5 bg-black text-white text-center">
        <a href="spacex.html" style="text-decoration: none; color: white;">
            <h1>SpaceX Rocket Launches</h1>
        </a>
        <p>Upcoming launch data and past launch archive</p>
    </div>

    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="spacex.html">Front page</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="upcoming.html">Upcoming launches</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="archive.html">Past launch archive</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid p-4 d-flex flex-column justify-content-center align-items-center">
        <div id="past-launches" class="container mt-4"></div>
    </div>

    <div class="container-fluid p-4 bg-dark text-white text-center mt-4">
        <ul class="nav justify-content-center">
            <li class="nav-item">
                <a class="nav-link text-white" href="spacex.html">Front page</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="upcoming.html">Upcoming launches</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="archive.html">Past launch archive</a>
            </li>
        </ul>
    </div>

    <script>
        function fetchPastLaunches() {

            fetch('https://lldev.thespacedevs.com/2.2.0/launch/previous/?limit=10')
                .then(function (response) {
                    return response.json();
                })

                .then(function (data) {
                    var pastLaunchesContainer = document.getElementById("past-launches");
                    pastLaunchesContainer.innerHTML = "";

                        var content = "";

                        for (var i = 0; i < data.results.length; i++) {
                            var launch = data.results[i];
                            var launchDate = new Date(launch.window_start);
                            var formattedDate = launchDate.toLocaleDateString('fi-FI');
                            var formattedTime = launchDate.toLocaleTimeString('fi-FI');

                            var imageUrl = launch.image ? launch.image : "https://via.placeholder.com/500";

                            content +=
                                "<div class='card bg-dark text-white mb-3' style='max-width: 500px;'>" +
                                "<img class='card-img-top' src='" + imageUrl + "' alt='Launch Image'>" +
                                "<div class='card-body'>" +
                                "<h5 class='card-title'>" + launch.name + "</h5>" +
                                "<p class='card-text'>Date: " + formattedDate + " " + formattedTime + "</p>" +
                                "</div>" +
                                "</div>";
                        }

                        pastLaunchesContainer.innerHTML = content;
                })
                .catch(function (error) {
                    document.getElementById("past-launches").innerHTML = "<p class='text-danger'>Failed to load past launches.</p>";
                });
        }

        fetchPastLaunches();

    </script>


</body>

</html>
