<!DOCTYPE html>
<html lang="fi">

<head>
    <title>SpaceX Launch Data</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: black;
            color: white;
        }
    </style>
</head>

<body>

    <div class="p-5 bg-black text-white text-center">
        <a href="spacex.html" style="text-decoration: none; color: white;">
            <h1>SpaceX Rocket Launches</h1>
        </a>
        <p>Upcoming launch data and past launch archive</p>
    </div>

    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="spacex.html">Front page</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="upcoming.html">Upcoming launches</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="archive.html">Past launch archive</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container d-flex flex-column justify-content-center align-items-center text-center mt-4">
        <div id="vastaus" class="mt-4"></div>
        <h2>Upcoming launches</h2>
    </div>

    <div class="container-fluid p-4 bg-dark text-white text-center mt-4">
        <ul class="nav justify-content-center">
            <li class="nav-item">
                <a class="nav-link text-white" href="spacex.html">Front page</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="upcoming.html">Upcoming launches</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="archive.html">Past launch archive</a>
            </li>
        </ul>
    </div>

    <script>
        function fetchLaunch() {
            fetch('https://lldev.thespacedevs.com/2.2.0/launch/upcoming/?limit=10')
                .then(function (response) {
                    return response.json();
                })

                .then(function (data) {
                    var arkisto = document.getElementById("vastaus");
                    vastaus.innerHTML = "";
                    var kuvaUrl = "";
                    var rakettiNimi = "";
                    var mission = "";
                    var kuvaus = "";

                    for (var i = 0; i < data.results.length; i++) {
                        kuvaUrl = data.results[i].image;
                        rakettiNimi = data.results[i].configuration.name;
                        mission = data.results[i].mission.name;
                        kuvaus = data.results[i].mission.description;

                        var pvm = new Date(data.results[i].window_start);
                        pvm = pvm.toLocaleDateString('fi-FI');
                        var aika = pvn.toLocaleTimeString('fi-FI');

                        var kortti = "<div class=-container->" + "<div class='row align-items-center vastaus->"
                            + "<div class='col-md-7'>" + "<img src='" + kuvaUrl + "' class='kuva' alt='Kuva rakettilähdöstä'>"
                            + "</div>" + "<div class='col-md-6 text-start'>" + "<h5>" + rakettiNimi + "</h5>"
                            + "<p>" + mission + "</p>" + "<p>" + kuvaus + "</p>" + "<p>" + pvm + " " + aika + "</p>"
                            + "</div>" + "</div>" + "</div>";
                        arkisto.innerHTML += kortti;
                    }
                })
                .catch(function (error) {
                    document.getElementById("vastaus").innerHTML =
                        "<p class='text-danger'>No launch data found.</p>";
                });
        }

        fetchLaunch();

    </script>


</body>

</html>
