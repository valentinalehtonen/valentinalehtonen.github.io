<!DOCTYPE html>

<html lang="fi">

<head>

    <title>JSON Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            font-family: Calibri, sans-serif;
            background-color: #ebdfdb;
            color: #4E342E;
            padding-top: 70px;
            margin: 20px;
        }

        img {
            max-width: 50%;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark navbar-expand-lg fixed-top" style="background-color: #4E342E;">
        <div class="container-fluid">
            <a class="navbar-brand text-bg-light p-2 rounded" href="#">JSON testailua</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="navbar-collapse collapse" id="navbar">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="kurssi.html">Kurssi</a></li>
                    <li class="nav-item"><a class="nav-link" href="toteutus.html">Toteutus</a></li>
                </ul>
    </nav>

    <div id="vastaus">

    </div>

    <script>

        function kerro(responseJson) {
            var teksti = "";
            teksti += "<h1>" + responseJson.otsikko + "</h1>";
            teksti += "<p>" + "<b>" + responseJson.kuvaus + "</b>" + "<br>";
            teksti += "<p>" + "<img src='" + responseJson.kuva + "' alt='Kuva huoneesta' />";
            teksti += "<p><b>" + "Opintojakso" + "</b></p>"
                + "<p>" + "Nimi: " + responseJson.opintojakso.nimi + "<br>"
                + "Tunnus: " + responseJson.opintojakso.tunnus + "<br>"
                + "Opintopisteet: " + responseJson.opintojakso.opintopisteet + "</p><br>";
            teksti += "<p><b>" + "Sisältö:" + "</b><br>"
            for (var i = 0; i < responseJson.sisalto.length; i++) {
                teksti += responseJson.sisalto[i] + "<br>";
            }
            teksti += "</p>";
            teksti += "<p><b>" + "Tekniikat:" + "</b><br>"
            for (var i = 0; i < responseJson.tekniikat.length; i++) {
                teksti += responseJson.tekniikat[i].aihe + " (linkki: " + responseJson.tekniikat[i].linkki + ")" + "<br>";
            }
            teksti += "</p>";

            document.getElementById("vastaus").innerHTML = teksti;
        }
        fetch('https://valentinalehtonen.github.io/oma.JSON')
            .then(function (response) {
                return response.json();
            })

            .then(function (responseJson) {
                kerro(responseJson);
            })

            .catch(function (error) {
                document.getElementById("vastaus").innerHTML = "<p>Tietoa ei pystytä hakemaan</p>";
            })
    </script>

</body>
