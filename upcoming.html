<!DOCTYPE html>
<html lang="fi">

<head>
    <title>Upcoming Launch Data</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: black;
            color: white;
        }

        .kuva {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="p-5 bg-black text-white text-center">
        <a href="spacex.html" style="text-decoration: none; color: white;">
            <h1>SpaceX Rocket Launches</h1>
        </a>
        <p>Upcoming launch data and past launch archive</p>
    </div>

    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="spacex.html">Front page</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="upcoming.html">Upcoming launches</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="archive.html">Past launch archive</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container text-center mt-4">
        <h2>Upcoming launches</h2>
        <div id="vastaus" class="mt-4"></div>
    </div>

    <div class="container-fluid p-4 bg-dark text-white text-center mt-4">
        <ul class="nav justify-content-center">
            <li class="nav-item">
                <a class="nav-link text-white" href="spacex.html">Front page</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="upcoming.html">Upcoming launches</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="archive.html">Past launch archive</a>
            </li>
        </ul>
    </div>

    <script>
        function fetchLaunch() {
            fetch('https://lldev.thespacedevs.com/2.2.0/launch/upcoming/?limit=8')
                .then(function (response) {
                    return response.json();
                })

                .then(function (data) {
                    var arkisto = document.getElementById("vastaus");
                    arkisto.innerHTML = "";

                    for (var i = 0; i < data.results.length; i++) {
                        var pvm = new Date(data.results[i].window_start);
                        var pvmEU = pvm.toLocaleDateString('fi-FI');
                        var aikaEU = pvm.toLocaleTimeString('fi-FI');

                        var kortti =
                            "<div class='container-fluid'>" +
                            "<div class='row align-items-center my-4 p-3 bg-dark rounded'>" +
                            "<div class='col-md-6'>" +
                            "<img src='" + data.results[i].image + "' class='kuva' alt='Launch Image'>" +
                            "</div>" +
                            "<div class='col-md-6 text-start'>" +
                            "<h5>" + data.results[i].rocket.configuration.name + "</h5>" +
                            "<p><strong>Mission:</strong> " + data.results[i].mission.name + "</p>" +
                            "<p><strong>Details:</strong> " + data.results[i].mission.description + "</p>" +
                            "<p><strong>Date:</strong> " + pvmEU + " " + aikaEU + "</p>" +
                            "</div>" + "</div>" + "</div>";
                        arkisto.innerHTML += kortti;
                    }
                })
                .catch(function (error) {
                    document.getElementById("vastaus").innerHTML =
                        "<p class='text-danger'>No launch data found.</p>";
                });
        }

        fetchLaunch();

    </script>

</body>

</html>
