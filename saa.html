<!DOCTYPE html>

<html lang="fi">

<head>

    <title>JSON Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            font-family: Calibri, sans-serif;
            background-color: #ebdfdb;
            color: #4E342E;
            padding-top: 70px;
            margin: 20px;
        }

        a {
            color: #4E342E;
        }

        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark navbar-expand-lg fixed-top" style="background-color: #4E342E;">
        <div class="container-fluid">
            <a class="navbar-brand text-bg-light p-2 rounded" href="#">JSON testailua</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="navbar-collapse collapse" id="navbar">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="kurssi.html">Kurssi</a></li>
                    <li class="nav-item"><a class="nav-link" href="toteutus.html">Toteutus</a></li>
                    <li class="nav-item"><a class="nav-link" href="tapahtumat.html">Tapahtumat</a></li>
                    <li class="nav-item"><a class="nav-link" href="saa.html">Sää</a></li>
                </ul>
    </nav>

    <div id="vastaus">

    </div>

    <script>

        function kerro(responseJson, kaupunki) {
            var teksti = "";
            teksti += "<h1>Säätiedot</h1>";

            teksti += "<p>Kaupunki: " + responseJson.name + "<br>";
            teksti += "Sää: " + responseJson.weather[0].description + "<br>"
            teksti += "Lämpötila: " + responseJson.main.temp + "°C<br>";
            teksti += "Tuulen nopeus: " + responseJson.wind.speed + " m/s<br>";
            teksti += "<img src='http://openweathermap.org/img/wn/" + responseJson.weather[0].icon + ".png' alt='Sääikoni'><br>";
            teksti += "</p>";

            document.getElementById("vastaus").innerHTML += teksti;
        }
        fetch('https://api.openweathermap.org/data/2.5/weather?q=Helsinki&appid=665ecd56dfc08dbb50feb8b8f5034e28&units=metric&lang=fi')
            .then(function (response) {
                return response.json();
            })

            .then(function (responseJson) {
                kerro(responseJson, "Helsinki");
            })

            .catch(function (error) {
                document.getElementById("vastaus").innerHTML = "<p>Tietoa ei pystytä hakemaan</p>";
            })

            fetch('https://api.openweathermap.org/data/2.5/weather?q=Tampere&appid=665ecd56dfc08dbb50feb8b8f5034e28&units=metric&lang=fi')
            .then(function (response) {
                return response.json();
            })

            .then(function (responseJson) {
                kerro(responseJson, "Tampere");
            })

            .catch(function (error) {
                document.getElementById("vastaus").innerHTML = "<p>Tietoa ei pystytä hakemaan</p>";
            })

    </script>

</body>
